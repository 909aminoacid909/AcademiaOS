<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>AcademiaOS</title>
        <link
        rel="stylesheet"
        href="./styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Jacquard+12&family=Jacquarda+Bastarda+9&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    </head>
    <body id="background">
        <div id="taskbar">
            <p class="jacquarda-bastarda-9-regular open-button" id="openWelcomeTab">AcademiaOS</p>
            <p class="time-now jacquarda-bastarda-9-regular"> Time </p>
        </div>
        <div id="welcome" class="app-window welcome-window">
            <div id="welcomeheader" class="app-header">
                <p class="jacquarda-bastarda-9-regular header-title" >Welcome!</p>
                <img src="./images/closebutton.png" height="30px" id="closeWelcomeTab" class="close-button">
            </div>
        </div>
        
        <div id="notesapp" class="flex-row app">
            <div>
            <img src="./images/book222.png" id="open-notes-tab" class="open-button">
            </div>
            <div>
            <p class="jacquarda-bastarda-9-regular apptitle" >Notes</p>
            </div>
        </div>
        <div id="notes" class="app-window notes-window">
            <div id="notesheader" class="app-header">
                <p class="jacquarda-bastarda-9-regular header-title" >Notes</p>
                <img src="./images/closebutton.png" height="30px" id="close-notes-tab" class="close-button">
            </div>
            <div id="new-note">
                <button id="new-note-button">new note</button>
            </div>
            <div id="notes-flex-box">
                <div class="blank-notes">Blank</div>
                <div class="blank-notes">New Chemistry Note Chemical equation</div>
                <div class="blank-notes">Blank</div>
                <div class="blank-notes">Blank</div>
                <div class="blank-notes">Blank</div>
                <div class="blank-notes">Blank</div>
                
            </div>
        </div>



        <div id="musicapp" class="flex-row app">
            <div>
            <img src="./images/recordplayer.png" id="open-music-tab" class="open-button">
            </div>
            <div>
            <p class="jacquarda-bastarda-9-regular apptitle" >Record Player</p>
            </div>
        </div>
        <div id="music" class="app-window music-window">
            <div id="musicheader" class="app-header">
                <p class="jacquarda-bastarda-9-regular header-title" >Record Player</p>
                <img src="./images/closebutton.png" height="30px" id="close-music-tab" class="close-button">
            </div>
            <div id="music-item-holder">
                <img id="music-player-image" src="./images/music-image.png" height="300px">
                <div class="music-text">Song Name</div>
                <div class="music-text">Artist</div>
                <input id="slider-song" type="range" width="400px">
                <div>
                    <button class="music-button">⇄</button>
                    <button class="music-button">⏮</button>
                    <button class="music-button">▶</button>
                    <button class="music-button">⏭</button>
                    <button class="music-button">↻</button>
                </div>
            </div>
        </div>



        <div id="calculatorapp" class="flex-row app">
            <div>
            <img src="./images/calcblue.png" id="open-calculator-tab" class="open-button">
            </div>
            <div>
            <p class="jacquarda-bastarda-9-regular apptitle" >Calculator</p>
            </div>
        </div>
        <div id="calculator" class="app-window calc-window">
            <div id="calculatorheader" class="app-header">
                <p class="jacquarda-bastarda-9-regular header-title" >Calculator</p>
                <img src="./images/closebutton.png" height="30px" id="close-calculator-tab" class="close-button">
            </div>
            <div id="act-calculator">
                    <input id="display" readonly>
                    <div id="keys">
                        <button class="calc-button" onclick="appendToDisplay('+')">+</button>
                        <button class="calc-button" onclick="appendToDisplay('7')">7</button>
                        <button class="calc-button" onclick="appendToDisplay('8')">8</button>
                        <button class="calc-button" onclick="appendToDisplay('9')">9</button>
                        <button class="calc-button" onclick="appendToDisplay('-')">-</button>
                        <button class="calc-button" onclick="appendToDisplay('4')">4</button>
                        <button class="calc-button" onclick="appendToDisplay('5')">5</button>
                        <button class="calc-button" onclick="appendToDisplay('6')">6</button>
                        <button class="calc-button" onclick="appendToDisplay('*')">*</button>
                        <button class="calc-button" onclick="appendToDisplay('1')">1</button>
                        <button class="calc-button" onclick="appendToDisplay('2')">2</button>
                        <button class="calc-button" onclick="appendToDisplay('3')">3</button>
                        <button class="calc-button" onclick="appendToDisplay('/')">/</button>
                        <button class="calc-button" onclick="appendToDisplay('0')">0</button>
                        <button class="calc-button" onclick="appendToDisplay('.')">.</button>
                        <button class="calc-button" onclick="calculate()">=</button>
                        <button class="calc-button" onclick="clearDisplay()">C</button>
                    </div>
            </div>
        </div>


        <div id="browserapp" class="flex-row app">
            <div>
            <img src="./images/telee.png" id="open-browser-tab" class="open-button">
            </div>
            <div>
            <p class="jacquarda-bastarda-9-regular apptitle" >Browser</p>
            </div>
        </div>
        <div id="browser" class="app-window">
            <div id="browserheader" class="app-header">
                <p class="jacquarda-bastarda-9-regular header-title" >Browser</p>
                <img src="./images/closebutton.png" height="30px" id="close-browser-tab" class="close-button">
            </div>
        </div>
        
        


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./index.js"></script>
    </body>
</html>
